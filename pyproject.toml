[project]
name = "quarterly-rag"
version = "0.1.0"
description = "Local, open-source RAG over SEC 10-Q/10-K filings: grounding, chunking, retrieval quality, hallucination control, and refusal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kevin Zhang" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "anthropic>=1.3.0",
    "lxml>=6.1.3",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag = "quarterly_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarterly_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["quarterly_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: needs Ollama, network, or Docker (deselected by default)",
]
