name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The eval gate is manual on purpose: it calls a model, and a project principle says
  # CI never does. Running it needs an endpoint GitHub's runners cannot reach, so it is
  # started by hand against a self-hosted runner or with LLM_* pointing at a hosted API.
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Also run the eval regression gate (needs a reachable model endpoint)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest
      - name: Commit messages reference a ticket
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-commit-msg.sh --range "origin/${{ github.base_ref }}..HEAD"
          else
            git log -1 --format=%B | scripts/check-commit-msg.sh -
          fi

  eval:
    # Never on push or pull request: this job calls a model, and the corpus and index it
    # needs are not in the repository. Start it from the Actions tab with run_eval set,
    # on a runner that can reach an endpoint, after `rag ingest download`, `rag ingest
    # parse`, `rag chunk build` and `rag index build` have run there.
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --frozen
      - name: Eval regression gate
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EMBED_BASE_URL: ${{ secrets.EMBED_BASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: make eval
